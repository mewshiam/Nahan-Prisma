version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci: "

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps: "
    # Only the Prisma toolchain devDependencies exist here — the runtime
    # itself has zero npm dependencies, which is a property worth keeping.
