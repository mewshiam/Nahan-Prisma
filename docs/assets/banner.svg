<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Nahan-Prisma — the hidden gateway, ported from Cloudflare Workers to Prisma Compute">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowCyan" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#01d7e4" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#01d7e4" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#01d7e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="12%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#f00e5c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f00e5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="90%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#f3c306" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f3c306" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeFade" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1280" height="400" fill="url(#edgeFade)"/>
    </mask>
    <style>
      .sans  { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="400" fill="#0e0e0e"/>
  <rect width="1280" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="400" fill="url(#glowCyan)"/>
  <rect width="1280" height="400" fill="url(#glowPink)"/>
  <rect width="1280" height="400" fill="url(#glowGold)"/>

  <!-- confetti accents -->
  <g opacity="0.85">
    <rect x="118" y="88" width="11" height="11" rx="2.5" fill="#f3c306" transform="rotate(18 123.5 93.5)"/>
    <rect x="198" y="262" width="9" height="9" rx="2" fill="#01d7e4" transform="rotate(-14 202.5 266.5)"/>
    <rect x="1078" y="118" width="11" height="11" rx="2.5" fill="#f00e5c" transform="rotate(24 1083.5 123.5)"/>
    <rect x="1148" y="248" width="9" height="9" rx="2" fill="#f43531" transform="rotate(-20 1152.5 252.5)"/>
    <rect x="84" y="304" width="8" height="8" rx="2" fill="#f37a03" transform="rotate(45 88 308)"/>
    <rect x="1188" y="76" width="7" height="7" rx="1.5" fill="#f3c306" transform="rotate(10 1191.5 79.5)"/>
    <rect x="260" y="150" width="6" height="6" rx="1.5" fill="#f00e5c" opacity="0.55" transform="rotate(30 263 153)"/>
    <rect x="1010" y="200" width="6" height="6" rx="1.5" fill="#01d7e4" opacity="0.55" transform="rotate(-30 1013 203)"/>
  </g>

  <!-- segmented N mark (84px) -->
  <g transform="translate(598,34) scale(3.5)">
    <path fill="#01d7e4" d="M3 0H6V14H3A3 3 0 0 1 0 11V3A3 3 0 0 1 3 0Z"/>
    <path fill="#f3c306" d="M0 14H6V24H3A3 3 0 0 1 0 21V14Z"/>
    <path fill="#f00e5c" d="M9 0H17A3 3 0 0 1 20 3V6H6V3A3 3 0 0 1 9 0Z"/>
    <path fill="#f43531" d="M6 6H12V12H6Z"/>
    <path fill="#f37a03" d="M6 12H17A3 3 0 0 1 20 15V21A3 3 0 0 1 17 24H9A3 3 0 0 1 6 21V12Z"/>
  </g>

  <!-- Persian wordmark -->
  <text x="640" y="154" text-anchor="middle" class="sans" font-size="26" fill="#f3c306" direction="rtl" unicode-bidi="bidi-override">&#x0646;&#x0647;&#x0627;&#x0646;</text>

  <!-- wordmark -->
  <text x="640" y="212" text-anchor="middle" class="sans" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Nahan-Prisma</text>

  <!-- tagline -->
  <text x="640" y="248" text-anchor="middle" class="sans" font-size="19" fill="#a3a3a3">The hidden gateway &#8212; ported from Cloudflare Workers to Prisma Compute</text>

  <!-- capability pills -->
  <g>
    <rect x="350" y="288" width="110" height="32" rx="16" fill="#151515" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="372" cy="304" r="3" fill="#01d7e4"/>
    <text x="412" y="309" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#e5e5e5">VLESS</text>

    <rect x="476" y="288" width="118" height="32" rx="16" fill="#151515" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="498" cy="304" r="3" fill="#f00e5c"/>
    <text x="540" y="309" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#e5e5e5">TROJAN</text>

    <rect x="610" y="288" width="150" height="32" rx="16" fill="#151515" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="632" cy="304" r="3" fill="#f37a03"/>
    <text x="692" y="309" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#e5e5e5">BUN RUNTIME</text>

    <rect x="776" y="288" width="150" height="32" rx="16" fill="#151515" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="798" cy="304" r="3" fill="#f3c306"/>
    <text x="858" y="309" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#e5e5e5">SQLITE STATE</text>
  </g>

  <!-- deploy command -->
  <text x="640" y="368" text-anchor="middle" class="mono" font-size="15" fill="#646567">$ npx prisma deploy module.ts</text>
</svg>
